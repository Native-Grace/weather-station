[platformio]
src_dir = .
include_dir = .

[env:sparkfun_esp32micromod]
platform = espressif32
board = sparkfun_esp32micromod
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbserial-1420
upload_speed = 460800
lib_ldf_mode = chain+
lib_deps =
	bblanchon/ArduinoJson @ ^7.2.1
	paulstoffregen/OneWire
	milesburton/DallasTemperature
	paulstoffregen/Time
	sstaub/NTP
	https://github.com/sparkfun/SparkFun_BME280_Arduino_Library.git
	https://github.com/sparkfun/SparkFun_AS3935_Lightning_Detector_Arduino_Library.git
	https://github.com/sparkfun/SparkFun_VEML6075_Arduino_Library.git
	https://github.com/sparkfun/SparkFun_Weather_Meter_Kit_Arduino_Library.git
build_src_filter =
	+<*>
	-<example/>
	-<.git/>
	-<.pio/>
